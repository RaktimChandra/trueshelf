name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Run all tests (unit, pipeline, API, browser/engine parity)
        run: python -m pytest -q
      - name: Stress test (unseen supplier style + throughput)
        run: python scripts/stress_test.py
